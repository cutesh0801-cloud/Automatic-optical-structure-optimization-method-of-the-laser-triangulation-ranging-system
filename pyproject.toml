[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scheimpflug-optimeter"
version = "0.1.0"
description = "Scheimpflug optical calculation and real-time visualization desktop application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Scheimpflug OptiMeter contributors" }]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "PySide6>=6.8,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[project.gui-scripts]
scheimpflug-optimeter = "scheimpflug_optimeter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scheimpflug_optimeter = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["scheimpflug_optimeter"]
branch = true
