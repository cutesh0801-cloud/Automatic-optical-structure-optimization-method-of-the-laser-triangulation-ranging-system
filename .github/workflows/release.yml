name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install "uv==0.11.31"
          uv sync --frozen --python 3.12 --extra dev
      - name: Verify Python and optional camera SDK
        run: >
          uv run --frozen python -c
          "import importlib.util, sys;
          assert sys.version_info[:2] == (3, 12), sys.version;
          assert importlib.util.find_spec('pypylon') is None"
      - name: Verify private source documents are not tracked
        shell: pwsh
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File packaging/verify_public_sources.ps1
      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: uv run --frozen pytest
      - name: Build
        run: uv run --frozen pyinstaller --noconfirm packaging/scheimpflug_optimeter.spec
      - name: Smoke portable application
        shell: pwsh
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File packaging/smoke_portable.ps1
      - name: Assemble portable archive
        shell: pwsh
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File packaging/assemble_portable.ps1
      - name: Publish
        shell: pwsh
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          Scheimpflug-OptiMeter-windows-x64.zip
          Scheimpflug-OptiMeter-windows-x64.zip.sha256
          --verify-tag
          --generate-notes
          --title "Scheimpflug OptiMeter $env:GITHUB_REF_NAME"
